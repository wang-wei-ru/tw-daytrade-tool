/* =========================================================
   基本工具
   ========================================================= */

function normalizeCode(value){
  return String(value||"").trim().toUpperCase();
}

function validCode(code){
  return /^\d{4,6}[A-Z]?$/.test(code);
}

function finite(v){
  const n=Number(v);
  return Number.isFinite(n);
}

function num(v){

  if(v===null || v===undefined || v===""){
    return null;
  }

  const n=Number(
    String(v)
      .replace(/,/g,"")
      .replace(/\s/g,"")
  );

  return Number.isFinite(n) ? n : null;
}

function fmt(v,d=2){
  return finite(v)
    ? Number(v).toFixed(d)
    : "--";
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function monthKey(date){

  const y=date.getFullYear();

  const m=String(
    date.getMonth()+1
  ).padStart(2,"0");

  return `${y}${m}01`;
}

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function percent(a,b){

  if(!b){
    return "--";
  }

  return `${((a/b)*100).toFixed(1)}%`;
}

function avg(arr){

  const x=arr.filter(finite);

  if(!x.length){
    return null;
  }

  return x.reduce(
    (a,b)=>a+b,
    0
  )/x.length;
}


/* =========================================================
   ETF 判斷
   ========================================================= */

function isETF(code,name=""){

  const c=normalizeCode(code);

  const n=String(name||"");

  if(KNOWN_ETF.has(c)){
    return true;
  }

  if(
    (
      /^00\d{2,3}[A-Z]?$/.test(c) ||
      /^00\d{3}[A-Z]$/.test(c)
    ) &&
    (
      n.includes("ETF") ||
      n.includes("指數") ||
      n.includes("高股息") ||
      n.includes("主動")
    )
  ){
    return true;
  }

  return false;
}


/* =========================================================
   FETCH
   ========================================================= */

async function fetchJSON(
  url,
  timeout=15000
){

  let lastError=null;

  for(
    let attempt=0;
    attempt<CONFIG.RETRIES;
    attempt++
  ){

    const controller=
      new AbortController();

    const timer=setTimeout(
      ()=>controller.abort(),
      timeout
    );

    try{

      const separator=
        url.includes("?")
          ? "&"
          : "?";

      const finalURL=
        url+
        separator+
        "_="+Date.now();

      const res=await fetch(
        finalURL,
        {
          cache:"no-store",
          signal:controller.signal
        }
      );

      clearTimeout(timer);

      if(!res.ok){
        throw new Error(
          `HTTP_${res.status}`
        );
      }

      const text=await res.text();

      if(!text || !text.trim()){
        throw new Error(
          "EMPTY_RESPONSE"
        );
      }

      try{
        return JSON.parse(text);
      }catch{
        throw new Error(
          "INVALID_JSON"
        );
      }

    }catch(err){

      clearTimeout(timer);

      lastError=err;

      if(
        attempt<
        CONFIG.RETRIES-1
      ){
        await sleep(
          600*(attempt+1)
        );
      }
    }
  }

  throw (
    lastError ||
    new Error("LOAD_FAILED")
  );
}


/* =========================================================

function parseTWSEMarket(data){

  if(!Array.isArray(data)){
    throw new Error(
      "TWSE_MARKET_FORMAT"
    );
  }

  const map=new Map();

  data.forEach(x=>{

    const code=normalizeCode(
      x.Code ||
      x.code ||
      x["證券代號"]
    );

    if(!code){
      return;
    }

    const name=
      x.Name ||
      x.name ||
      x["證券名稱"] ||
      STOCK_NAMES[code] ||
      "";

    const close=num(
      x.ClosingPrice ??
      x.Close ??
      x.close ??
      x["收盤價"]
    );

    if(!finite(close)){
      return;
    }

    const info={

      code,
      name,

      market:"TWSE",

      close,

      open:num(
        x.OpeningPrice ??
        x.Open ??
        x.open ??
        x["開盤價"]
      ),

      high:num(
        x.HighestPrice ??
        x.High ??
        x.high ??
        x["最高價"]
      ),

      low:num(
        x.LowestPrice ??
        x.Low ??
        x.low ??
        x["最低價"]
      ),

      volume:num(
        x.TradeVolume ??
        x.TradingShares ??
        x.Volume ??
        x.volume ??
        x["成交股數"]
      ),

      change:num(
        x.Change ??

        x["漲跌價差"]
      ),

      referencePrice:num(
        x.ReferencePrice ??
        x.referencePrice ??
        x["前一日收盤價"]
      ),

      limitUp:num(
        x.LimitUp ??
        x.limitUp ??
        x["漲停價"]
      ),

      limitDown:num(
        x.LimitDown ??
        x.limitDown ??
        x["跌停價"]
      ),

      raw:x,

      updatedAt:Date.now()
    };

    map.set(
      code,
      info
    );
  });

  return map;
}

    );
  });

  return map;
}

  );

async function fetchMarket(){

  const results=
    await Promise.allSettled([

      fetchTWSEMarket(),

      fetchTPEXMarket()

    ]);

  const merged=new Map();

  const errors=[];

  const sources={
    TWSE:false,
    TPEX:false
  };

  if(
    results[0].status==="fulfilled"
  ){

    sources.TWSE=true;

    results[0].value.forEach(
      (v,k)=>{
        merged.set(k,v);
      }
    );

  }else{

    errors.push(
      `上市：${
        results[0].reason?.message ||
        "Load failed"
      }`
    );
  }


  if(
    results[1].status==="fulfilled"
  ){

    sources.TPEX=true;

    results[1].value.forEach(
      (v,k)=>{
        merged.set(k,v);
      }
    );

  }else{

    errors.push(
      `上櫃：${
        results[1].reason?.message ||
        "Load failed"
      }`
    );
  }


  if(!merged.size){

    throw new Error(
      "上市與上櫃市場資料皆取得失敗。"+
      errors.join("；")
    );
  }

  marketCache=merged;

  marketSource=new Map();

  merged.forEach(
    (info,code)=>{
      marketSource.set(
        code,
        info.market
      );
    }
  );

  return {
    map:merged,
    sources,
    errors
  };
}


/* =========================================================
   日期
   ========================================================= */

function parseROCDate(value){

  const s=String(value||"")
    .trim()
    .replace(/\//g,"-");

  const parts=s.split("-");

  if(parts.length!==3){
    return s;
  }

  let y=Number(parts[0]);

  if(y<1911){
    y+=1911;
  }

  return `${y}-${String(parts[1]).padStart(2,"0")}-${String(parts[2]).padStart(2,"0")}`;
}


/* =========================================================
   TWSE 歷史
   ========================================================= */

function parseTWSEHistoryRows(
  json,
  code
){

  if(
    !json ||
    !Array.isArray(json.data)
  ){
    throw new Error(
      "TWSE_HISTORY_FORMAT"
    );
  }

  const rows=[];

  json.data.forEach(r=>{

    if(
      !Array.isArray(r) ||
      r.length<7
    ){
      return;
    }

    const date=parseROCDate(
      r[0]
    );

    const volume=num(r[1]);

    const open=num(r[3]);

    const high=num(r[4]);

    const low=num(r[5]);

    const close=num(r[6]);

    if(
      !date ||
      !finite(close)
    ){
      return;
    }

    rows.push({

      date,

      volume,

      open,

      high,

      low,

      close,

      code

    });
  });

  return rows;
}

/* =========================================================
   歷史月份
   ========================================================= */

async function fetchHistoryMonthTWSE(
  code,
  key
){

  const cacheKey=
    `TWSE_${code}_${key}`;

  if(historyCache.has(cacheKey)){
    return {
      rows:historyCache.get(cacheKey),
      cached:true
    };
  }

  const params=
    `?response=json&date=${key}&stockNo=${encodeURIComponent(code)}`;

  const urls=[

    API.TWSE_HISTORY+
    params,

    API.TWSE_HISTORY_BACKUP+
    params

  ];

  const errors=[];

  for(
    let i=0;
    i<urls.length;
    i++
  ){

    try{

      const json=await fetchJSON(
        urls[i],
        CONFIG.HISTORY_TIMEOUT
      );

      const rows=
        parseTWSEHistoryRows(
          json,
          code
        );

      if(rows.length){

        historyCache.set(
          cacheKey,
          rows
        );

        return {
          rows,
          cached:false
        };
      }

      errors.push(
        `TWSE路徑${i+1}: 無有效資料`
      );

    }catch(err){

      errors.push(
        `TWSE路徑${i+1}: ${
          err.message ||
          "Load failed"
        }`
      );
    }
  }

  throw new Error(
    errors.join("；")
  );
}


async function fetchHistoryMonthTPEX(
  code,
  key
){

  /*
    TPEx endpoint 使用民國年月：
    2026/09 -> 115/09
  */

  const y=Number(
    key.slice(0,4)
  );

  const m=Number(
    key.slice(4,6)
  );

  const rocYear=y-1911;

  const cacheKey=
    `TPEX_${code}_${key}`;

  if(historyCache.has(cacheKey)){
    return {
      rows:historyCache.get(cacheKey),
      cached:true
    };
  }

  const url=
    API.TPEX_HISTORY+
    `?l=zh-tw`+
    `&d=${rocYear}/${String(m).padStart(2,"0")}`+
    `&stkno=${encodeURIComponent(code)}`;

  try{

    const json=await fetchJSON(
      url,
      CONFIG.HISTORY_TIMEOUT
    );

    const rows=
      parseTPEXHistoryRows(
        json,
        code
      );

    if(rows.length){

      historyCache.set(
        cacheKey,
        rows
      );

      return {
        rows,
        cached:false
      };
    }

    throw new Error(
      "TPEX_HISTORY_EMPTY"
    );

  }catch(err){

    throw new Error(
      `TPEX：${
        err.message ||
        "Load failed"
      }`
    );
  }
}


/* =========================================================
   判斷市場
   ========================================================= */

async function detectMarket(
  code
){

  code=normalizeCode(code);

  const cached=
    marketSource.get(code);

  if(cached){
    return cached;
  }

  /*
    先嘗試上市。
  */

  try{

    const result=
      await fetchHistoryMonthTWSE(
        code,
        monthKey(new Date())
      );

    if(result.rows.length){
      marketSource.set(
        code,
        "TWSE"
      );

      return "TWSE";
    }

  }catch{}

  /*
    再嘗試上櫃。
  */

  try{

    const result=
      await fetchHistoryMonthTPEX(
        code,
        monthKey(new Date())
      );

    if(result.rows.length){

      marketSource.set(
        code,
        "TPEX"
      );

      return "TPEX";
    }

  }catch{}

  return null;
}


/* =========================================================
   歷史資料
   ========================================================= */

async function fetchHistory(
  code,
  months=3,
  forcedMarket=null
){

  code=normalizeCode(code);

  let market=
    forcedMarket ||
    marketSource.get(code) ||
    null;

  /*
    如果市場未知：
    先嘗試目前市場快照。
  */

  if(!market){

    const info=
      marketCache.get(code);

    if(info?.market){
      market=info.market;
    }
  }

  /*
    如果仍未知，
    用當月資料探測市場。
  */

  if(!market){

    market=
      await detectMarket(code);
  }

  if(!market){

    throw new Error(
      `找不到 ${code} 的上市／上櫃資料來源`
    );
  }

  const all=[];

  const errors=[];

  const now=new Date();

  for(
    let i=0;
    i<months;
    i++
  ){

    const d=new Date(
      now.getFullYear(),
      now.getMonth()-i,
      1
    );

    const key=monthKey(d);

    try{

      let result;

      if(market==="TPEX"){

        result=
          await fetchHistoryMonthTPEX(
            code,
            key
          );

      }else{

        result=
          await fetchHistoryMonthTWSE(
            code,
            key
          );
      }

      all.push(
        ...result.rows
      );

    }catch(err){

      errors.push(
        `${key}: ${err.message}`
      );
    }

    if(
      i<months-1
    ){
      await sleep(180);
    }
  }

  const unique=new Map();

  all.forEach(r=>{

    unique.set(
      `${r.code}_${r.date}`,
      r
    );

  });

  const rows=[
    ...unique.values()
  ].sort(
    (a,b)=>
      a.date.localeCompare(
        b.date
      )
  );

  if(!rows.length){

    const error=
      new Error(
        `查不到 ${code} 的歷史資料。`+
        `市場：${market}。`+
        `${errors.join("；")}`
      );

    error.detail=errors;

    throw error;
  }

  return {

    rows,

    errors,

    market

  };
}

   名稱
   ========================================================= */

function resolveName(

/* =========================================================
   技術因子
   ========================================================= */

function calculateFactors(
  rows,
  current
){

  if(
    !rows ||
    rows.length<20
  ){

    return {

      available:false,

      reason:"歷史資料不足",

      trend:null,
      volume:null,
      price:null,
      momentum:null,
      risk:null

    };
  }

  const closes=
    rows
      .map(x=>x.close)
      .filter(finite);

  const volumes=
    rows
      .map(x=>x.volume)
      .filter(finite);

  const last20=
    closes.slice(-20);

  const last5=
    closes.slice(-5);

  const ma20=avg(last20);

  const ma5=avg(last5);

  const last=
    closes[closes.length-1];

  const prev=
    closes[closes.length-2];


  let trend=50;

  if(
    finite(ma20) &&
    finite(ma5)
  ){

    trend=
      ma5>ma20
        ? 82
        : ma5<ma20
          ? 42
          : 62;
  }


  let momentum=50;

  if(
    finite(last) &&
    finite(prev)
  ){

    const chg=
      ((last-prev)/prev)*100;

    if(chg>=2){
      momentum=90;
    }else if(chg>=1){
      momentum=82;
    }else if(chg>=.3){
      momentum=72;
    }else if(chg<=-2){
      momentum=20;
    }else if(chg<=-1){
      momentum=30;
    }else if(chg<=-.3){
      momentum=42;
    }
  }


  const avg20Vol=
    avg(
      volumes.slice(-20)
    );

  const latestVol=
    finite(current?.volume)
      ? current.volume
      : volumes[volumes.length-1];

  let volume=50;

  if(
    finite(avg20Vol) &&
    avg20Vol>0 &&
    finite(latestVol)
  ){

    const ratio=
      latestVol/avg20Vol;

    if(ratio>=2){
      volume=92;
    }else if(ratio>=1.5){
      volume=85;
    }else if(ratio>=1.15){
      volume=75;
    }else if(ratio>=.8){
      volume=62;
    }else{
      volume=40;
    }
  }


  let price=50;

  if(
    finite(current?.close) &&
    finite(ma20)
  ){

    if(
      current.close>
      ma20*1.03
    ){
      price=86;
    }else if(
      current.close>ma20
    ){
      price=76;
    }else if(
      current.close<
      ma20*.97
    ){
      price=32;
    }else{
      price=58;
    }
  }


  let risk=55;

  const recent=
    closes.slice(-10);

  if(recent.length>=5){

    const high=
      Math.max(...recent);

    const low=
      Math.min(...recent);

    const range=
      low>0
        ? ((high-low)/low)*100
        : 99;

    if(range<=5){
      risk=80;
    }else if(range<=8){
      risk=65;
    }else if(range<=12){
      risk=48;
    }else{
      risk=30;
    }
  }

  return {

    available:true,

    trend,
    volume,
    price,
    momentum,
    risk

  };
}


/* =========================================================
   方向
   ========================================================= */

function directionScores(f){

  if(!f.available){

    return {
      buy:null,
      sell:null
    };
  }

  const buy=
    f.trend*.28+
    f.volume*.22+
    f.price*.16+
    f.momentum*.22+
    f.risk*.12;

  const sell=
    (100-f.trend)*.28+
    f.volume*.22+
    (100-f.price)*.16+
    (100-f.momentum)*.22+
    f.risk*.12;

  return {

    buy:Math.round(buy),

    sell:Math.round(sell)

  };
}


function getDirection(stock){

  if(
    isETF(
      stock.code,
      stock.name
    )
  ){

    return {

      type:"ETF",

      label:"🚫 ETF",

      score:null,

      cls:"gray"

    };
  }

  if(
    !stock.factors?.available
  ){

    return {

      type:"DATA",

      label:"資料不足",

      score:null,

      cls:"gray"

    };
  }

  const s=stock.scores;

  /*
    09:35 前：
    不直接給正式方向訊號。
  */

  if(!formalMode()){

    return {

      type:"WARMUP",

      label:"🟡 開盤觀察",

      score:Math.max(
        s.buy,
        s.sell
      ),

      cls:"yellow"

    };
  }


  if(
    s.buy>=CONFIG.SIGNAL_SCORE &&
    s.buy-s.sell>=CONFIG.SIGNAL_GAP
  ){

    return {

      type:"BUY",

      label:"🟢 沖買",

      score:s.buy,

      cls:"green"

    };
  }


  if(
    s.sell>=CONFIG.SIGNAL_SCORE &&
    s.sell-s.buy>=CONFIG.SIGNAL_GAP
  ){

    return {

      type:"SELL",

      label:"🔴 沖賣",

      score:s.sell,

      cls:"red"

    };
  }


  return {

    type:"WAIT",

    label:"🟡 觀望",

    score:Math.max(
      s.buy,
      s.sell
    ),

    cls:"yellow"

  };
}


/* =========================================================
   建立股票
   ========================================================= */

async function buildStock(
  code,
  historyMonths=3,
  marketInfo=null
){

  code=normalizeCode(code);

  const info=
    marketInfo ||
    marketCache.get(code) ||
    null;

  const name=
    resolveName(
      code,
      info
    );

  const forcedMarket=
    info?.market ||
    marketSource.get(code) ||
    null;

  const history=
    await fetchHistory(
      code,
      historyMonths,
      forcedMarket
    );

  const current={

    close:
      finite(info?.close)
        ? info.close
        : history.rows[
            history.rows.length-1
          ]?.close,

    volume:
      finite(info?.volume)
        ? info.volume
        : history.rows[
            history.rows.length-1
          ]?.volume

  };

  const factors=
    calculateFactors(
      history.rows,
      current
    );

  const scores=
    directionScores(
      factors
    );

  const stock={

    code,

    name,

    market:
      info?.market ||
      history.market,

    price:current.close,

    volume:current.volume,

    history:history.rows,

    historyErrors:
      history.errors,

    factors,

    scores,

    updatedAt:Date.now(),

    eligibilityVerified:false,

    buyEligible:false,

    sellEligible:false

  };

  stock.direction=
    getDirection(stock);

  return stock;
}


/* =========================================================
   Radar 候選
   ========================================================= */

function marketCandidates(){

  const arr=[];

  marketCache.forEach(
    info=>{

      const code=info.code;

      if(
        isETF(
          code,
          info.name
        )
      ){
        return;
      }

      if(
        !finite(info.close)
      ){
        return;
      }

      const inEntry=

        info.close>=
        CONFIG.RADAR_MIN_PRICE &&

        info.close<=
        CONFIG.RADAR_MAX_PRICE;

      const existing=
        radarUniverse.get(code);

      const inKeep=

        info.close>=
        CONFIG.RADAR_KEEP_MIN &&

        info.close<=
        CONFIG.RADAR_KEEP_MAX;

      if(
        !inEntry &&
        !(existing && inKeep)
      ){
        return;
      }

      arr.push(info);

    }
  );

  return arr;
}


/* =========================================================
   Radar
   ========================================================= */

async function scanRadar(){

  const status=
    document.getElementById(
      "radarStatus"
    );

  if(!marketOpenWindow()){

    status.className=
      "notice warn";

    status.innerHTML=
      "⏰ 雷達目前休息中。<br>"+
      "09:30 後開始市場掃描。";

    return;
  }


  status.className=
    "notice";

  status.innerHTML=
    "🔄 正在取得上市＋上櫃市場資料……";


  try{

    const market=
      await fetchMarket();

    const candidates=
      marketCandidates();


    /*
      新候選：
      每輪只處理有限數量，
      避免手機同時打大量歷史 API。
    */

    const fresh=

      candidates
        .filter(
          x=>!radarUniverse.has(
            x.code
          )
        )
        .sort(
          (a,b)=>
            (b.volume||0)-
            (a.volume||0)
        )
        .slice(
          0,
          CONFIG.FRESH_RADAR_LIMIT
        );


    for(
      const info of fresh
    ){

      try{

        const stock=
          await buildStock(
            info.code,
            2,
            info
          );

        radarUniverse.set(
          info.code,
          stock
        );

      }catch(err){

        console.log(
          "Radar history failed",
          info.code,
          info.market,
          err
        );
      }

      await sleep(120);
    }


    /*
      更新已存在候選
    */

    candidates.forEach(
      info=>{

        const old=
          radarUniverse.get(
            info.code
          );

        if(!old){
          return;
        }

        old.price=
          info.close;

        old.volume=
          info.volume;

        old.marketInfo=
          info;

        old.market=
          info.market;

        old.updatedAt=
          Date.now();

        old.factors=
          calculateFactors(
            old.history,
            {
              close:info.close,
              volume:info.volume
            }
          );

        old.scores=
          directionScores(
            old.factors
          );

        old.direction=
          getDirection(old);

      }
    );


    /*
      超出 98～252：
      從 Radar 候選池移除。
    */

    radarUniverse.forEach(
      (stock,code)=>{

        const price=
          stock.price;

        if(
          !finite(price) ||

          price<
          CONFIG.RADAR_KEEP_MIN ||

          price>
          CONFIG.RADAR_KEEP_MAX
        ){

          radarUniverse.delete(
            code
          );
        }

      }
    );


    radarStocks=

      [...radarUniverse.values()]

        .filter(
          x=>
            x.direction.type!=="ETF"
        )

        .sort(
          (a,b)=>{

            const sa=
              finite(
                a.direction.score
              )
                ? a.direction.score
                : -1;

            const sb=
              finite(
                b.direction.score
              )
                ? b.direction.score
                : -1;

            return sb-sa;
          }
        )

        .slice(
          0,
          CONFIG.MAX_RADAR
        );


    renderRadar();

    lastRadarScan=
      Date.now();


    const sourceText=

      `${market.sources.TWSE?"上市✓":"上市✕"}｜`+
      `${market.sources.TPEX?"上櫃✓":"上櫃✕"}`;


    const partial=

      market.errors.length
        ? `<br>⚠️ ${
            escapeHTML(
              market.errors.join("；")
            )
          }`
        : "";


    status.className=
      market.errors.length
        ? "notice warn"
        : "notice good";


    status.innerHTML=

      `✅ 雷達更新完成｜${formatTime(lastRadarScan)}<br>`+

      `${sourceText}｜候選 ${radarUniverse.size} 支｜`+

      `顯示 TOP ${CONFIG.MAX_RADAR}`+

      partial;


  }catch(err){

    status.className=
      "notice danger";

    status.innerHTML=
      `❌ 雷達更新失敗<br>`+
      `${escapeHTML(
        err.message ||
        "Load failed"
      )}`;

    renderRadarError(
      err
    );
  }
}

/* =========================================================
   追蹤更新
   ========================================================= */

async function refreshTracking(){

  if(!trackingStocks.length){

    renderTracking();

    return;
  }


  try{

    const result=
      await fetchMarket();

    const market=
      result.map;


    trackingStocks.forEach(
      stock=>{

        const info=
          market.get(
            stock.code
          );

        if(!info){
          return;
        }


        stock.price=
          info.close;

        stock.volume=
          info.volume;

        stock.marketInfo=
          info;

        stock.market=
          info.market;


        stock.factors=
          calculateFactors(
            stock.history,
            {
              close:info.close,
              volume:info.volume
            }
          );


        stock.scores=
          directionScores(
            stock.factors
          );


        const previous=
          stock.direction;


        stock.direction=
          getDirection(
            stock
          );


        stock.lastUpdate=
          Date.now();


        stock.previousDirection=
          previous;


        if(

          previous &&

          finite(
            previous.score
          ) &&

          finite(
            stock.direction.score
          ) &&

          previous.score>=85 &&

          stock.direction.score<85

        ){

          stock.downgraded=true;
        }


        const ref=
          info.referencePrice;

        if(
          finite(ref) &&
          ref>0 &&
          finite(stock.price)
        ){

          const pct=
            Math.abs(
              (
                stock.price-ref
              )/ref
            )*100;

          stock.limitWarning=
            pct>=8;
        }

      }
    );


    lastTrackingScan=
      Date.now();

    renderTracking();


  }catch(err){

    console.log(
      "Tracking update failed",
      err
    );


    document.getElementById(
      "trackingStatus"
    ).innerHTML=

      `⚠️ 本次更新失敗，
       保留上一筆資料。<br>`+

      `${formatTime(
        Date.now()
      )}`;

  }
}

/* =========================================================
   歷史研究
   ========================================================= */

function researchHistory(
  rows
){

  const buy=[];

  const sell=[];


  for(
    let i=19;
    i<rows.length-1;
    i++
  ){

    const slice=
      rows.slice(
        0,
        i+1
      );


    const f=
      calculateFactors(
        slice,
        rows[i]
      );


    const s=
      directionScores(f);


    const next=
      rows[i+1];


    if(
      !finite(next.close) ||
      !finite(rows[i].close)
    ){
      continue;
    }


    const move=

      (
        (
          next.close-
          rows[i].close
        )/
        rows[i].close
      )*100;


    if(

      s.buy>=
      CONFIG.SIGNAL_SCORE &&

      s.buy-s.sell>=
      CONFIG.SIGNAL_GAP

    ){

      buy.push({

        move,

        favorable:
          move>0

      });

    }


    if(

      s.sell>=
      CONFIG.SIGNAL_SCORE &&

      s.sell-s.buy>=
      CONFIG.SIGNAL_GAP

    ){

      sell.push({

        move,

        favorable:
          move<0

      });

    }

  }


  return {

    buy:
      summaryResearch(buy),

    sell:
      summaryResearch(sell)

  };
}


function summaryResearch(
  arr
){

  if(!arr.length){

    return {

      count:0,

      favorable:0,

      unfavorable:0,

      avgFav:null,

      avgAdverse:null,

      maxFail:0

    };
  }


  const favorable=
    arr.filter(
      x=>x.favorable
    );


  const unfavorable=
    arr.filter(
      x=>!x.favorable
    );


  const favMoves=
    favorable.map(
      x=>Math.abs(x.move)
    );


  const adverseMoves=
    unfavorable.map(
      x=>Math.abs(x.move)
    );


  let currentFail=0;

  let maxFail=0;


  arr.forEach(
    x=>{

      if(x.favorable){

        currentFail=0;

      }else{

        currentFail++;

        maxFail=
          Math.max(
            maxFail,
            currentFail
          );

      }

    }
  );


  return {

    count:arr.length,

    favorable:
      favorable.length,

    unfavorable:
      unfavorable.length,

    avgFav:
      avg(favMoves),

    avgAdverse:
      avg(adverseMoves),

    maxFail

  };
}

function switchPage(

){

  document
    .querySelectorAll(".page")
    .forEach(
      x=>
        x.classList.remove(
          "active"
        )
    );


  document
    .querySelectorAll(".tab")
    .forEach(
      x=>
        x.classList.remove(
          "active"
        )
    );


  const target=
    document.getElementById(
      page
    );


  if(target){

    target.classList.add(
      "active"
    );

  }


  const tab=
    document.querySelector(
      `.tab[data-page="${page}"]`
    );


  if(tab){

    tab.classList.add(
      "active"
    );

  }


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });
}


document
  .querySelectorAll(".tab")
  .forEach(
    tab=>{

      tab.addEventListener(
        "click",
        ()=>{
          switchPage(
            tab.dataset.page
          );
        }
      );

    }
  );


function openStock(
  code
){

  document.getElementById(
    "stockInput"
  ).value=
    normalizeCode(code);


  switchPage(
    "stock"
  );


  searchStock();
}


/* =========================================================
   時間
   ========================================================= */

function marketOpenWindow(){

  const now=
    new Date();

  const h=
    now.getHours();

  const m=
    now.getMinutes();


  /*
    正確的 09:30 判斷。
    原 v0.8.1 的 bug：
    只判斷 h < 9，
    導致 09:00 就可能啟動。
  */

  return (

    h>
      CONFIG.RADAR_START_HOUR

    ||

    (
      h===
        CONFIG.RADAR_START_HOUR &&

      m>=
        CONFIG.RADAR_START_MINUTE
    )

  );
}


function formalMode(){

  const now=
    new Date();

  const h=
    now.getHours();

  const m=
    now.getMinutes();


  return (

    h>
      CONFIG.FORMAL_HOUR

    ||

    (
      h===
        CONFIG.FORMAL_HOUR &&

      m>=
        CONFIG.FORMAL_MINUTE
    )

  );
}


function formatTime(ts){

  if(!ts){
    return "--";
  }

  return new Date(ts)
    .toLocaleTimeString(
      "zh-TW",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );
}


/* =========================================================
   Timer
   ========================================================= */

function startRadarTimer(){

  if(radarTimer){

    clearInterval(
      radarTimer
    );

  }

  radarTimer=
    setInterval(
      scanRadar,
      CONFIG.RADAR_INTERVAL
    );
}


function startTrackingTimer(){

  if(trackingTimer){

    clearInterval(
      trackingTimer
    );

  }

  trackingTimer=
    setInterval(
      refreshTracking,
      CONFIG.TRACK_INTERVAL
    );
}


/* =========================================================
   初始化
   ========================================================= */

function init(){

  document.getElementById(
    "radarStatus"
  ).innerHTML=
    "⏳ 系統初始化中……";


  renderTracking();


  /*
    不在頁面載入時大量抓資料。
  */

  setTimeout(
    scanRadar,
    800
  );


  startRadarTimer();

  startTrackingTimer();


  /*
    12:55 出場提醒
  */

  setInterval(

    ()=>{

      const now=
        new Date();


      if(

        now.getHours()===12 &&

        now.getMinutes()>=55

      ){

        const key=

          "exitReminder_"+
          now.toISOString()
            .slice(0,10);


        if(
          !localStorage.getItem(
            key
          )
        ){

          localStorage.setItem(
            key,
            "1"
          );


          if(
            trackingStocks.length
          ){

            alert(

              "⏰ 12:55 提醒\n\n"+

              "請檢查追蹤中的當沖部位，"+
              "避免接近收盤才處理。"

            );

          }

        }

      }

    },

    30000

  );

}


init();

</script>
